"gemini-3.1-pro-preview.output" = 12.00
"gpt-4.1.input" = 2.00
"gpt-4.1.output" = 8.00
"gpt-5.input" = 1.25
"gpt-5.output" = 10.00
"gpt-5.1.input" = 1.25
