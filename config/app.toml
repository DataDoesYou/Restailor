# --- Stripe (optional; disabled by default) ---
[stripe]
enabled = false
# Webhook secret should be provided via env or keyring in production; default empty
webhook_secret = ""

# --- Email / SMTP Configuration ---
[email]
# SMTP server settings (non-secret defaults)
server = "smtp-relay.brevo.com"
port = 587
from = "noreply@example.com"
from_name = "Resume Tailor"

# TLS/SSL settings
starttls = true
ssl_tls = false
use_credentials = true

# Note: MAIL_USERNAME and MAIL_PASSWORD should be set via Doppler/environment
# These settings can be overridden by environment variables:
#   MAIL_SERVER, MAIL_PORT, MAIL_FROM, MAIL_FROM_NAME,
#   MAIL_STARTTLS, MAIL_SSL_TLS, MAIL_USE_CREDENTIALS,
#   MAIL_USERNAME (secret), MAIL_PASSWORD (secret)

# UI settings
[ui]
# Cache credits display to avoid per-render /users/me calls
credits_ttl_seconds = 120
# Max recursion/scan depth when walking provider SDK objects to extract text on demo page
deep_text_scan_limit = 10000
