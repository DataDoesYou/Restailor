name: restailor

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-${DB_USER:-postgres}}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-${DB_NAME:-restailor}}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    command:
      - sh
      - -lc
      - |
        chmod +x scripts/migrate_then_run.sh || true
        scripts/migrate_then_run.sh \
          uvicorn main:app \
            --host 0.0.0.0 --port 8000 \
            --reload --reload-delay 0.5 \
            --reload-dir /app \
            --reload-include '*.py' \
            --reload-exclude 'frontend/*' \
            --reload-exclude '.git/*' \
            --reload-exclude 'node_modules/*' \
            --reload-exclude '__pycache__/*' \
            --no-access-log
    environment:
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-${DB_USER:-postgres}}
      POSTGRES_DB: ${POSTGRES_DB:-${DB_NAME:-restailor}}
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      WATCHFILES_FORCE_POLLING: "true"
      LOGIN_CAPTCHA_REQUIRED: ${LOGIN_CAPTCHA_REQUIRED:-0}
      SIGNUP_CAPTCHA_REQUIRED: ${SIGNUP_CAPTCHA_REQUIRED:-0}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      STRICT_SECRETS: ${STRICT_SECRETS:-0}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      VERIFY_SECRET_KEY: ${VERIFY_SECRET_KEY}
      RESET_SECRET_KEY: ${RESET_SECRET_KEY}
      TOTP_FERNET_KEY: ${TOTP_FERNET_KEY}
      SECURITY_REMEMBER_SIGNER_SECRET: ${SECURITY_REMEMBER_SIGNER_SECRET}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROK_API_KEY: ${GROK_API_KEY}
      MAIL_SERVER: ${MAIL_SERVER:-localhost}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-noreply@example.com}
      MAIL_STARTTLS: ${MAIL_STARTTLS:-0}
      MAIL_SSL_TLS: ${MAIL_SSL_TLS:-0}
      MAIL_USE_CREDENTIALS: ${MAIL_USE_CREDENTIALS:-0}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      DEMO_USER_EMAIL: ${DEMO_USER_EMAIL:-}
    volumes:
      - ../:/app
    working_dir: /app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 2s
      retries: 30

  arq:
    build:
      context: ..
      dockerfile: docker/arq.Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER:-${DB_USER:-postgres}}
      POSTGRES_DB: ${POSTGRES_DB:-${DB_NAME:-restailor}}
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      STRICT_SECRETS: ${STRICT_SECRETS:-0}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      TOTP_FERNET_KEY: ${TOTP_FERNET_KEY}
      SECURITY_REMEMBER_SIGNER_SECRET: ${SECURITY_REMEMBER_SIGNER_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      CLAUDE_API_KEY: ${CLAUDE_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROK_API_KEY: ${GROK_API_KEY}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
    volumes:
      - ../:/app
    working_dir: /app
    command:
      - sh
      - -lc
      - |
        chmod +x scripts/migrate_then_run.sh || true
        scripts/migrate_then_run.sh arq worker.WorkerSettings
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

  next:
    build:
      context: ../frontend
      dockerfile: ../docker/next.Dockerfile
      target: dev
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ../frontend:/app
      - next-build:/app/.next
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      # Use polling so hot reload works with Docker Desktop file sharing on Windows
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      # Shorter poll to feel snappy; adjust if CPU spikes
      CHOKIDAR_INTERVAL: "300"
      # Public (browser) calls from http://localhost:3000 should hit the host-mapped API port
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8000"
      # Internal SSR calls from inside the Next container must use the Docker service DNS
      INTERNAL_API_BASE_URL: "http://api:8000"
      # Public site key for Turnstile widget. Must come from Doppler/env.
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-support@example.com}
      NEXT_PUBLIC_GTAG_ID: ${NEXT_PUBLIC_GTAG_ID:-}
    depends_on:
      api:
        condition: service_healthy

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --url http://api:8000
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - default

volumes:
  pgdata:
    name: resume-tailor_pgdata
  next-build:
