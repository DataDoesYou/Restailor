name: Security Scan

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    # Run weekly on Mondays at 9 AM UTC
    - cron: '0 9 * * 1'

jobs:
  bandit:
    name: Bandit Security Scan
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1
          virtualenvs-create: true
          virtualenvs-in-project: true
      
      - name: Install dependencies
        run: poetry install --no-interaction --no-root
      
      - name: Run Bandit security scan
        run: |
          poetry run bandit -r restailor backend services -v -n 1 -x .git,__pycache__,.venv,venv,frontend,node_modules,docs,e2e,tests -f json -o bandit_report.json || true
          poetry run bandit -r restailor backend services -v -n 1 -x .git,__pycache__,.venv,venv,frontend,node_modules,docs,e2e,tests -f screen || true
      
      - name: Upload Bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit_report.json
          retention-days: 30
      
      - name: Check for security issues
        run: |
          TOTAL_ISSUES=$(poetry run python -c "import json; data = json.load(open('bandit_report.json')); print(len(data['results']))")
          MEDIUM_HIGH=$(poetry run python -c "import json; data = json.load(open('bandit_report.json')); issues = [r for r in data['results'] if r['issue_severity'] in ['MEDIUM', 'HIGH']]; print(len(issues))")
          echo "Total security issues found: $TOTAL_ISSUES"
          echo "Medium/High severity issues: $MEDIUM_HIGH"
          if [ "$MEDIUM_HIGH" -gt "0" ]; then
            echo "❌ Medium or High severity security issues detected! Review the report above."
            exit 1
          else
            echo "✅ No Medium/High severity issues found! ($TOTAL_ISSUES low severity issues are acceptable)"
          fi

  npm-audit:
    name: NPM Audit (Frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run NPM Audit
        # Fail only on high or critical vulnerabilities
        run: npm audit --audit-level=high
