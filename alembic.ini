[alembic]
script_location = alembic
# Intentionally unset; URL is built in alembic/env.py from environment/keyring.
# If you need to hard-code temporarily, set DATABASE_URL env or ALEMBIC_SQLALCHEMY_URL.
sqlalchemy.url = 
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s %(name)s %(message)s
