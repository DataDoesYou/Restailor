[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
markers =
	order: set test execution ordering
	security: security input injection and idempotency tests
	critical: marks tests that cover critical API flows and billing
norecursedirs = e2e/node_modules e2e/node_modules/* frontend/node_modules frontend/node_modules/* mutants mutants/* tests_quarantine tests_quarantine/*
addopts = -vv
